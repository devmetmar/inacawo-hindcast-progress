id: proj_inaca_hindcast
name: INACAWO Hindcast Progress Tracking
objective: >
  Complete the remaining internal INACAWO hindcast simulation work with
  traceable execution, output, validation, and acceptance evidence, while
  maintaining an auditable inventory of the CLS Brazil historical archive.
status: ACTIVE
project_owner: member_01
team_member_ids:
  - member_01
  - member_02
  - member_03
  - member_04
scope:
  confirmed: null
  provisional:
    historical_claimed:
      start: "1995-01-01"
      end: "2014-12-31"
    remaining_claimed:
      start: "2015-01-01"
      end: "2025-12-31"
  notes: >
    Remaining end year NOT CONFIRMED (2015-2025 inclusive is 11 calendar years;
    project language also refers to a 30-year hindcast). Do not hardcode
    total_years or authoritative completion percentages until OPEN_QUESTIONS Q1
