name: Validate tracking data

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml jsonschema pytest
      - name: Schema and integrity validation
        run: python scripts/validate_data.py
      - name: Progress computation smoke
        run: python scripts/compute_progress.py
      - name: Generate dashboard
        run: python dashboard/generate.py
      - name: Tests
        run: pytest -q
